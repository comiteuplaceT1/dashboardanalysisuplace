<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Estudio Cotizaciones Válvulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1720; --panel-solid:#142735; --line:#223A4A; --text:#E9F1F4;
    --muted:#8CA4B2; --gold:#C99A3B; --amber:#D6A63C; --amber-dim:#D6A63C22;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:40px;
  }
  .card{
    max-width:520px; border:1px dashed var(--amber); background:var(--amber-dim);
    border-radius:6px; padding:32px 36px; text-align:left;
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--gold);}
  h1{font-family:'Space Grotesk',sans-serif; font-size:22px; margin-top:10px; font-weight:600;}
  p{color:var(--muted); font-size:14px; line-height:1.6; margin-top:14px;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Pendiente de generar</div>
    <h1>Dashboard: Estudio Cotizaciones Válvulas</h1>
    <p>Todavía no tengo un dashboard generado para este estudio en este proyecto. Cuando me compartas las cotizaciones de válvulas a comparar, lo construyo con el mismo formato y lo integro directamente en esta pestaña.</p>
  </div>
</body>
</html>
